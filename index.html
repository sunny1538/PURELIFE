<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pure Life — Partner Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap');

  :root{
    --navy:#24262B;
    --amber:#FF7A1A;
    --teal:#237A34;
    --teal-bg:#E5F3E7;
    --amber-bg:#FFEADA;
    --amber-text:#B5540C;
    --red:#B23A3A;
    --red-bg:#FBEAEA;
    --page:#EFEEE7;
    --card:#FFFFFF;
    --border:#E4E1D6;
    --input-border:#D6D2C4;
    --muted:#83817A;
    --sub:#5F5D57;
    --text:#1E1F22;
    --strong-text:#33342F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(560px 420px at 88% -8%, rgba(232,163,61,0.16), transparent 60%),
      radial-gradient(600px 460px at -10% 12%, rgba(27,42,74,0.10), transparent 55%),
      var(--page);
    font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;
  }
  .display{font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase;letter-spacing:0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .shell{max-width:460px;margin:0 auto;min-height:100vh;background:var(--card);box-shadow:0 0 0 1px rgba(27,42,74,0.06), 0 30px 60px -30px rgba(27,42,74,0.25);display:flex;flex-direction:column;}

  .topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:16px 20px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-icon{width:32px;height:32px;border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:var(--amber);}
  .brand-name{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-0.01em;}
  .logout-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-weight:600;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer;}
  .logout-btn:hover{background:#F1EFE6;color:var(--navy);}

  .content{flex:1;padding:20px 20px 32px;}

  h2.title{font-size:20px;font-weight:800;color:var(--navy);margin:0 0 4px;}
  h1.hero{font-size:26px;font-weight:800;line-height:1.25;color:var(--navy);margin:4px 0 0;}
  .subtitle{font-size:13px;color:var(--sub);margin:0 0 20px;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--amber);margin:0;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:14px 16px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:transform .05s ease;}
  .btn:active{transform:scale(0.99);}
  .btn-primary{background:var(--navy);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.06);}
  .btn-outline{background:#fff;border:1px solid var(--input-border);color:var(--navy);}
  .btn-between{justify-content:space-between;}
  .btn:disabled{opacity:0.6;cursor:default;}

  .link-btn{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;padding:0;margin-bottom:16px;}
  .link-btn:hover{color:var(--navy);}

  .field{margin-bottom:16px;}
  .field label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--strong-text);margin-bottom:6px;}
  .field label i{color:var(--muted);font-size:12px;}
  .req{color:#D9772E;}
  .field input[type=text], .field input[type=password], .field input[type=tel], .field input[type=email], .field select, .field textarea{
    width:100%;border:1px solid var(--input-border);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);background:#fff;outline:none;font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,74,0.10);}
  .field textarea{resize:vertical;}
  .field-error{margin-top:6px;display:none;align-items:center;gap:5px;font-size:12px;color:var(--red);}
  .field-error.show{display:flex;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:38px;}
  .pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;}

  .photo-row{display:flex;align-items:center;gap:12px;}
  .photo-circle{width:64px;height:64px;border-radius:50%;overflow:hidden;border:1px solid var(--input-border);background:#F1EFE6;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
  .photo-circle img{width:100%;height:100%;object-fit:cover;}
  .upload-btn{border:1px solid var(--input-border);background:#fff;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;}

  .info-card{border:1px solid var(--border);background:#fff;border-radius:14px;padding:16px;}
  .info-card .kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);margin:0 0 10px;}
  .info-list li{display:flex;gap:8px;font-size:13px;color:var(--strong-text);margin-bottom:8px;list-style:none;}
  .info-list li b{color:#D9772E;}

  .idcard{position:relative;overflow:hidden;border-radius:16px;background:var(--navy);padding:20px;color:#fff;box-shadow:0 10px 30px -12px rgba(27,42,74,0.55);}
  .idcard .blob1{position:absolute;right:-32px;top:-40px;width:112px;height:112px;border-radius:50%;background:rgba(232,163,61,0.15);}
  .idcard .blob2{position:absolute;left:-40px;bottom:-40px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,0.05);}
  .idcard-head{position:relative;display:flex;align-items:center;justify-content:space-between;}
  .idcard-head span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--amber);}
  .idcard-body{position:relative;display:flex;align-items:center;gap:12px;margin-top:12px;}
  .idcard-photo{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid rgba(232,163,61,0.7);background:rgba(255,255,255,0.1);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .idcard-photo img{width:100%;height:100%;object-fit:cover;}
  .idcard-name{font-size:15px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .idcard-mobile{font-size:12px;color:rgba(255,255,255,0.6);margin:2px 0 0;}
  .idcard-foot{position:relative;display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px dashed rgba(255,255,255,0.2);}
  .idcard-foot .id-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.5);margin:0;}
  .idcard-foot .id-value{font-size:19px;font-weight:700;letter-spacing:0.02em;color:var(--amber);margin:2px 0 0;}

  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;}
  .badge-active{background:var(--teal-bg);color:var(--teal);}
  .badge-pending{background:var(--amber-bg);color:var(--amber-text);}
  .badge-dot{width:6px;height:6px;border-radius:50%;}
  .badge-active .badge-dot{background:var(--teal);}
  .badge-pending .badge-dot{background:var(--amber-text);}

  .notice{margin-top:16px;border-radius:12px;padding:14px;font-size:13px;line-height:1.5;}
  .notice-amber{background:var(--amber-bg);color:#8A5A16;display:flex;gap:8px;align-items:flex-start;}
  .notice-neutral{background:#fff;border:1px solid var(--border);color:var(--strong-text);}

  .tabbar{display:flex;border:1px solid var(--border);background:#fff;border-radius:12px;padding:4px;margin-bottom:20px;}
  .tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:none;border-radius:8px;padding:9px 0;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;}
  .tab-btn.active{background:var(--navy);color:#fff;}

  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid #F1EFE6;padding:10px 0;}
  .row:last-child{border-bottom:none;}
  .row .r-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);}
  .row .r-value{text-align:right;font-size:13px;font-weight:500;color:var(--text);}

  .addon-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .addon-name{font-size:13px;font-weight:600;color:var(--text);}
  .addon-price{font-size:12px;color:var(--muted);margin-top:1px;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--input-border);background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .stepper button:disabled{opacity:0.3;cursor:default;}
  .stepper span{width:16px;text-align:center;font-size:13px;font-weight:600;}

  .total-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);margin-top:14px;padding-top:12px;}
  .total-row .t-label{font-size:14px;font-weight:800;color:var(--navy);}
  .total-row .t-value{font-size:18px;font-weight:800;color:var(--navy);}

  .section-kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);margin:20px 0 10px;}
  .section-kicker:first-child{margin-top:0;}

  .paid-banner{display:flex;align-items:center;gap:8px;background:var(--teal-bg);color:var(--teal);border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;margin-bottom:16px;}

  .empty-box{display:flex;flex-direction:column;align-items:center;border:1px dashed var(--input-border);background:#fff;border-radius:14px;padding:40px 20px;text-align:center;}
  .empty-box i{font-size:24px;color:#A8ACB5;margin-bottom:10px;}
  .empty-box p.t1{font-size:14px;font-weight:600;color:var(--strong-text);margin:0;}
  .empty-box p.t2{font-size:13px;color:#8B8F99;margin:4px 0 0;}

  .plan-card{border:1px solid var(--border);background:#fff;border-radius:16px;padding:18px;text-align:center;}
  .plan-bottle{width:88px;margin:2px auto 12px;display:block;filter:drop-shadow(0 10px 16px rgba(27,42,74,0.14));}
  .plan-product-name{font-size:15px;font-weight:800;color:var(--navy);margin:0;}
  .plan-product-desc{font-size:12px;color:var(--muted);margin:2px 0 0;}
  .plan-included-tag{display:inline-flex;align-items:center;gap:5px;background:var(--teal-bg);color:var(--teal);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700;margin-top:10px;}
  .bottle-qty-card{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px 14px;margin-top:14px;}
  .bottle-qty-card .bq-label{font-size:13px;font-weight:700;color:var(--text);}
  .bottle-qty-card .bq-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .product-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;}
  .product-icon{width:44px;height:44px;border-radius:10px;background:#F1EFE6;color:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .product-name{font-size:13.5px;font-weight:600;color:var(--text);margin:0;}
  .product-qty{font-size:12px;color:#8B8F99;margin:2px 0 0;}
  .product-status{flex-shrink:0;background:var(--amber-bg);color:var(--amber-text);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;}

  .toast{position:fixed;left:0;right:0;bottom:20px;display:flex;justify-content:center;z-index:50;pointer-events:none;}
  .toast-inner{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.18);pointer-events:auto;}
  .toast-inner i{color:#7FD9BE;}

  .center-block{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px;}
  .check-circle{width:48px;height:48px;border-radius:50%;background:var(--teal-bg);display:flex;align-items:center;justify-content:center;color:var(--teal);margin-bottom:12px;}

  /* screen transition */
  .content{animation:fadeIn .28s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* button polish */
  .btn-primary:hover{background:#233a63;}
  .btn-outline:hover{border-color:var(--navy);background:#F8F7F2;}
  .upload-btn:hover, .camera-btn:hover{border-color:var(--navy);background:#F8F7F2;}
  .tab-btn:not(.active):hover{background:#F1EFE6;color:var(--navy);}
  .stepper button:not(:disabled):hover{border-color:var(--navy);}
  .addon-item{transition:border-color .15s ease;}
  .addon-item:hover{border-color:#C9C5B6;}

  /* photo actions */
  .photo-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .camera-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--input-border);background:#fff;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;}

  /* spinner */
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  .btn-outline .spinner{border:2px solid rgba(27,42,74,0.25);border-top-color:var(--navy);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* camera modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,24,35,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .modal-title{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;}
  .camera-frame{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#0F1420;margin-bottom:14px;}
  .camera-frame video, .camera-frame canvas, .camera-frame img{width:100%;height:100%;object-fit:cover;display:block;}
  .camera-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.75);font-size:12.5px;text-align:center;padding:16px;}
  .camera-controls{display:flex;gap:10px;}
  .camera-controls .btn{padding:11px 14px;font-size:13px;}

  /* welcome hero */
  .hero-visual{position:relative;margin:20px 0 26px;height:150px;}
  .hero-card-mock{position:absolute;top:6px;left:0;width:210px;transform:rotate(-6deg);border-radius:14px;background:var(--navy);color:#fff;padding:14px 16px;box-shadow:0 18px 34px -14px rgba(27,42,74,0.5);}
  .hero-card-mock .hc-top{display:flex;align-items:center;justify-content:space-between;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;}
  .hero-card-mock .hc-row{display:flex;align-items:center;gap:8px;}
  .hero-card-mock .hc-avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,0.7);}
  .hero-card-mock .hc-name{font-size:11.5px;font-weight:700;}
  .hero-card-mock .hc-id{font-size:9.5px;color:rgba(255,255,255,0.55);margin-top:1px;}
  .hero-badge{position:absolute;top:64px;right:6px;width:150px;transform:rotate(5deg);border-radius:12px;background:#fff;border:1px solid var(--border);padding:10px 12px;box-shadow:0 16px 30px -16px rgba(27,42,74,0.35);}
  .hero-badge .hb-top{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--teal);margin-bottom:4px;}
  .hero-badge .hb-sub{font-size:9.5px;color:var(--muted);}

  .feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px;}
  .feature-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;transition:transform .15s ease, box-shadow .15s ease;}
  .feature-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px -14px rgba(27,42,74,0.35);}
  .feature-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:14px;}
  .feature-icon.amber{background:var(--amber-bg);color:var(--amber-text);}
  .feature-icon.teal{background:var(--teal-bg);color:var(--teal);}
  .feature-icon.navy{background:#E9ECF3;color:var(--navy);}
  .feature-title{font-size:11.5px;font-weight:700;color:var(--strong-text);line-height:1.3;}

  /* pure life: ambient motion */
  .bg-blob{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0;opacity:0.55;}
  .bg-blob1{width:340px;height:340px;top:-120px;right:-110px;background:rgba(232,163,61,0.30);animation:blobFloat 9s ease-in-out infinite;}
  .bg-blob2{width:300px;height:300px;bottom:-100px;left:-110px;background:rgba(27,42,74,0.18);animation:blobFloat 11s ease-in-out infinite reverse;}
  @keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(18px,-22px) scale(1.08);}}
  .shell{position:relative;z-index:1;}

  .brand-icon i{animation:sparklePulse 2.4s ease-in-out infinite;}
  @keyframes sparklePulse{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.15) rotate(8deg);}}

  .hero-card-mock{animation:cardFloat 4.5s ease-in-out infinite;}
  .hero-badge{animation:cardFloat 4.5s ease-in-out infinite 0.5s;}
  @keyframes cardFloat{0%,100%{transform:rotate(-6deg) translateY(0);}50%{transform:rotate(-6deg) translateY(-8px);}}
  .hero-badge{animation-name:cardFloatAlt;}
  @keyframes cardFloatAlt{0%,100%{transform:rotate(5deg) translateY(0);}50%{transform:rotate(5deg) translateY(-6px);}}

  .badge-active{position:relative;}
  .badge-active .badge-dot{position:relative;animation:dotPulse 1.6s ease-in-out infinite;}
  .badge-active .badge-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--teal);opacity:0;animation:ringPulse 1.6s ease-out infinite;}
  @keyframes dotPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}
  @keyframes ringPulse{0%{opacity:0.7;transform:scale(0.6);}100%{opacity:0;transform:scale(2.2);}}

  .btn i{transition:transform .2s ease;}
  .btn-primary:hover i, .btn-outline:hover i{transform:translateX(3px);}

  .toast-inner{animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(0.94);}to{opacity:1;transform:translateY(0) scale(1);}}

  .check-circle{animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popIn{0%{transform:scale(0);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}

  .idcard{animation:cardEnter .45s ease;}
  @keyframes cardEnter{from{opacity:0;transform:translateY(10px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}

  .confetti-piece{position:fixed;top:38%;left:50%;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:200;opacity:0;}
  @keyframes confettiBurst{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1);}100%{opacity:0;transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(0.4);}}
</style>
</head>
<body>
  <div class="bg-blob bg-blob1"></div>
  <div class="bg-blob bg-blob2"></div>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-wand-magic-sparkles" style="font-size:14px;"></i></div>
        <span class="brand-name display">Pure Life</span>
      </div>
      <button id="logout-btn" class="logout-btn" style="display:none;">
        <i class="fa-solid fa-right-from-bracket"></i> Log out
      </button>
    </div>
    <div id="content" class="content"></div>
  </div>
  <div id="toast-holder"></div>
  <div id="camera-modal"></div>

<script>
(function(){
  "use strict";

  var INCLUDED_PRODUCT = { name:"Pure Life Renewal Serum", desc:"30ml \u00b7 included in every plan", qty:1, icon:"fa-flask" };
  var PROCESSING_FEE = 299;
  var BOTTLE_PRICE = 200;

  function field(id,label,icon,type,placeholder,required,attrs){
    attrs = attrs || {};
    var attrStr = Object.keys(attrs).map(function(k){ return k+'="'+attrs[k]+'"'; }).join(" ");
    return '<div class="field"><label><i class="fa-solid '+icon+'"></i> '+label+(required?' <span class="req">*</span>':'')+'</label>'+
      '<input type="'+type+'" id="reg-'+id+'" placeholder="'+placeholder+'" '+attrStr+' />'+
      '<div class="field-error" id="err-'+id+'"><i class="fa-solid fa-circle-exclamation"></i><span></span></div></div>';
  }

  function setError(field, msg){
    var el = document.getElementById("err-"+field);
    if(!el) return;
    el.querySelector("span").textContent = msg;
    el.classList.add("show");
    var input = document.getElementById("reg-"+field);
    if(input) input.style.borderColor = "var(--red)";
  }
  function clearError(field){
    var el = document.getElementById("err-"+field);
    if(!el) return;
    el.classList.remove("show");
    var input = document.getElementById("reg-"+field);
    if(input) input.style.borderColor = "";
  }

  function submitRegistration(){
    ["fullName","mobile","password","confirmPassword","photo","address","city","pincode","state","email"].forEach(clearError);

    var fullName = val("reg-fullName");
    var mobile = val("reg-mobile");
    var password = val("reg-password");
    var confirmPassword = val("reg-confirmPassword");
    var address = val("reg-address");
    var city = val("reg-city");
    var pincode = val("reg-pincode");
    var state = val("reg-state");
    var email = val("reg-email");

    var ok = true;
    if(!fullName){ setError("fullName","Full name is required."); ok=false; }
    if(!/^\d{10}$/.test(mobile)){ setError("mobile","Enter a valid 10-digit mobile number."); ok=false; }
    else if(workers.some(function(w){ return w.mobile===mobile; })){ setError("mobile","This mobile number is already registered."); ok=false; }
    if(password.length < 6){ setError("password","Password must be at least 6 characters."); ok=false; }
    if(confirmPassword !== password){ setError("confirmPassword","Passwords do not match."); ok=false; }
    if(!regPhotoData){ setError("photo","Please upload a photo."); ok=false; }
    if(!address){ setError("address","Address is required."); ok=false; }
    if(!city){ setError("city","City is required."); ok=false; }
    if(!state){ setError("state","Select a state."); ok=false; }
    if(!/^\d{6}$/.test(pincode)){ setError("pincode","Enter a valid 6-digit pincode."); ok=false; }
    if(email && !/^\S+@\S+\.\S+$/.test(email)){ setError("email","Enter a valid email address."); ok=false; }

    if(!ok) return;

    seq += 1;
    var newWorker = {
      id: "PLP-" + pad(seq),
      fullName: fullName, mobile: mobile, password: password, photo: regPhotoData,
      address: address, city: city, state: state, pincode: pincode, email: email,
      status: "Registered", package: null, products: []
    };
    workers.push(newWorker);
    justRegisteredId = newWorker.id;
    sessionId = newWorker.id;
    extraBottles = 0;
    screen = "payment";
    renderScreen();
  }

  var cameraStream = null;

  function openCamera(){
    var holder = document.getElementById("camera-modal");
    holder.innerHTML =
      '<div class="modal-overlay" id="cam-overlay">'+
        '<div class="modal-box">'+
          '<p class="modal-title">Take your photo <button class="modal-close" id="cam-close"><i class="fa-solid fa-xmark"></i></button></p>'+
          '<div class="camera-frame" id="cam-frame">'+
            '<div class="camera-msg" id="cam-msg">Requesting camera access&hellip;</div>'+
          '</div>'+
          '<div class="camera-controls">'+
            '<button type="button" class="btn btn-outline" id="cam-cancel">Cancel</button>'+
            '<button type="button" class="btn btn-primary" id="cam-shoot" style="display:none;"><i class="fa-solid fa-camera"></i>&nbsp; Capture</button>'+
          '</div>'+
        '</div>'+
      '</div>';

    document.getElementById("cam-close").onclick = closeCamera;
    document.getElementById("cam-cancel").onclick = closeCamera;
    document.getElementById("cam-overlay").onclick = function(e){ if(e.target.id === "cam-overlay") closeCamera(); };

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      document.getElementById("cam-msg").textContent = "Camera not supported on this device. Please use Gallery instead.";
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then(function(stream){
        cameraStream = stream;
        var frame = document.getElementById("cam-frame");
        if(!frame) { stream.getTracks().forEach(function(t){ t.stop(); }); return; }
        frame.innerHTML = '<video id="cam-video" autoplay playsinline muted></video>';
        var video = document.getElementById("cam-video");
        video.srcObject = stream;
        document.getElementById("cam-shoot").style.display = "flex";
        document.getElementById("cam-shoot").onclick = capturePhoto;
      })
      .catch(function(){
        var msg = document.getElementById("cam-msg");
        if(msg) msg.textContent = "Camera access denied or unavailable. Please use Gallery instead.";
      });
  }

  function capturePhoto(){
    var video = document.getElementById("cam-video");
    if(!video) return;
    var canvas = document.createElement("canvas");
    var size = Math.min(video.videoWidth, video.videoHeight);
    canvas.width = 480; canvas.height = 480;
    var ctx = canvas.getContext("2d");
    var sx = (video.videoWidth - size) / 2;
    var sy = (video.videoHeight - size) / 2;
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, size, size, 0, 0, canvas.width, canvas.height);
    regPhotoData = canvas.toDataURL("image/jpeg", 0.9);
    document.getElementById("reg-photo-preview").innerHTML = '<img src="'+regPhotoData+'" alt="" />';
    clearError("photo");
    closeCamera();
  }

  function closeCamera(){
    if(cameraStream){
      cameraStream.getTracks().forEach(function(t){ t.stop(); });
      cameraStream = null;
    }
    document.getElementById("camera-modal").innerHTML = "";
  }

  /* ---------- REGISTERED SUCCESS ---------- */
  function confettiBurst(){
    var colors = ["#E8A33D","#12796B","#1B2A4A","#D9772E","#7FD9BE"];
    for(var i=0;i<18;i++){
      var el = document.createElement("div");
      el.className = "confetti-piece";
      el.style.background = colors[i % colors.length];
      var angle = (Math.PI * 2 * i) / 18 + Math.random()*0.4;
      var dist = 90 + Math.random()*70;
      el.style.setProperty("--cx", (Math.cos(angle)*dist)+"px");
      el.style.setProperty("--cy", (Math.sin(angle)*dist - 20)+"px");
      el.style.setProperty("--cr", (Math.random()*360)+"deg");
      el.style.animation = "confettiBurst .9s ease-out forwards";
      el.style.animationDelay = (Math.random()*0.1)+"s";
      document.body.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 1200); })(el);
    }
  }

          '<button id="go-register-2" style="background:none;border:none;color:var(--navy);font-weight:700;text-decoration:underline;cursor:pointer;font-size:13px;">Register here</button></p>'+
      '</div>'
    );
    updateTopbar();
    document.getElementById("back-btn").onclick = function(){ screen="welcome"; renderScreen(); };
    document.getElementById("go-register-2").onclick = function(){ regPhotoData=""; screen="register"; renderScreen(); };
    document.querySelector('[data-toggle="login-password"]').onclick = function(){
      var input = document.getElementById("login-password");
      var icon = this.querySelector("i");
      if(input.type === "password"){ input.type="text"; icon.className="fa-solid fa-eye-slash"; }
      else { input.type="password"; icon.className="fa-solid fa-eye"; }
    };

    document.getElementById("login-form").onsubmit = function(ev){
      ev.preventDefault();
      var errEl = document.getElementById("err-login");
      errEl.classList.remove("show");
      var mobile = val("login-mobile");
      var password = document.getElementById("login-password").value;
      if(!/^\d{10}$/.test(mobile)){ errEl.querySelector("span").textContent="Enter a valid 10-digit mobile number."; errEl.classList.add("show"); return; }
      if(!password){ errEl.querySelector("span").textContent="Enter your password."; errEl.classList.add("show"); return; }
      var found = workers.filter(function(w){ return w.mobile===mobile; })[0];
      if(!found){ errEl.querySelector("span").textContent="No account found with this mobile number."; errEl.classList.add("show"); return; }
      if(found.password !== password){ errEl.querySelector("span").textContent="Incorrect password. Try again."; errEl.classList.add("show"); return; }
      sessionId = found.id;
      currentTab = "account";
      screen = "app";
      renderScreen();
    };
  }

  /* ---------- DASHBOARD ---------- */
  function renderDashboard(){
    var w = currentWorker();
    if(!w){ screen="welcome"; renderScreen(); return; }
    var tabs = [
      {id:"account",label:"Account",icon:"fa-user"},
      {id:"package",label:"Package",icon:"fa-box"},
      {id:"products",label:"Products",icon:"fa-flask"}
    ];
    var tabBar = '<div class="tabbar">'+tabs.map(function(t){
      return '<button class="tab-btn'+(currentTab===t.id?' active':'')+'" data-tab="'+t.id+'"><i class="fa-solid '+t.icon+'"></i> '+t.label+'</button>';
    }).join("")+'</div>';

    setContent('<div>'+tabBar+'<div id="tab-content"></div></div>');
    updateTopbar();

    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.onclick = function(){ currentTab = btn.getAttribute("data-tab"); renderDashboard(); };
    });

    if(currentTab === "account") renderAccountTab(w);
    else if(currentTab === "package") renderPackageTab(w);
    else renderProductsTab(w);
  }

  function renderAccountTab(w){
    var pendingNotice = w.status !== "Active"
      ? '<div class="notice notice-amber"><i class="fa-solid fa-circle-exclamation" style="margin-top:2px;"></i>Complete the &#8377;299 processing package under the Package tab to activate your account.</div>'
      : "";
    var reorderCta = w.status === "Active"
      ? '<div class="info-card" style="margin-top:16px;display:flex;align-items:center;gap:14px;">'+
          '<div class="product-icon" style="background:var(--amber-bg);color:var(--amber-text);flex-shrink:0;"><i class="fa-solid fa-flask"></i></div>'+
          '<div style="flex:1;min-width:0;">'+
            '<p style="font-size:13.5px;font-weight:700;color:var(--navy);margin:0;">Need more bottles?</p>'+
            '<p style="font-size:12px;color:var(--muted);margin:2px 0 0;">Order Pure Life Renewal Serum anytime &mdash; &#8377;'+BOTTLE_PRICE+' per bottle.</p>'+
          '</div>'+
          '<button id="account-order-more" class="btn btn-primary" style="width:auto;padding:9px 14px;font-size:12.5px;flex-shrink:0;">Order more</button>'+
        '</div>'
      : "";
    document.getElementById("tab-content").innerHTML =
      idCardHtml(w)+
      '<div class="info-card" style="margin-top:16px;">'+
        rowHtml("fa-envelope","Email", esc(w.email || "Not provided"))+
        rowHtml("fa-location-dot","Address", esc(w.address+", "+w.city+", "+w.state+" - "+w.pincode))+
        '<div class="row"><span class="r-label"><i class="fa-solid fa-shield-halved"></i> Account Status</span>'+
        (w.status === "Active"
          ? '<span class="badge badge-active"><span class="badge-dot"></span>Active</span>'
          : '<span class="badge badge-pending"><span class="badge-dot"></span>Payment Pending</span>')+
        '</div>'+
      '</div>'+
      reorderCta+
      pendingNotice;

    if(w.status === "Active"){
      document.getElementById("account-order-more").onclick = function(){
        currentTab = "products";
        renderDashboard();
      };
    }
  }

  function rowHtml(icon,label,value){
    return '<div class="row"><span class="r-label"><i class="fa-solid '+icon+'"></i> '+label+'</span><span class="r-value">'+value+'</span></div>';
  }

  function renderPackageTab(w){
    var el = document.getElementById("tab-content");

    if(w.status === "Active" && w.package){
      var pkg = w.package;
      el.innerHTML =
        '<div class="paid-banner"><i class="fa-solid fa-circle-check"></i>Package payment completed</div>'+
        '<div class="info-card">'+
          '<p class="kicker">Order summary</p>'+
          rowHtml("fa-box","Processing Fee (1 bottle incl.)","&#8377;"+PROCESSING_FEE)+
          (pkg.extraBottles>0 ? rowHtml("fa-flask","Extra bottles", pkg.extraBottles+" &times; &#8377;"+BOTTLE_PRICE) : "")+
          rowHtml(pkg.method==="Online"?"fa-credit-card":"fa-wallet","Payment Method", pkg.method)+
          '<div class="total-row"><span class="t-label">Total Paid</span><span class="t-value">&#8377;'+pkg.total+'</span></div>'+
        '</div>';
      return;
    }

    extraBottles = 0;
    el.innerHTML =
      '<p class="kicker" style="margin:0 0 10px;">Registration package</p>'+
      planCardHtml()+
      '<p class="section-kicker">Choose payment method</p>'+
      '<div style="display:flex;flex-direction:column;gap:10px;">'+
        '<button id="pay-online" class="btn btn-primary btn-between"><span><i class="fa-solid fa-credit-card"></i> Pay Online</span><span id="pay-online-amt">&#8377;'+planTotal()+'</span></button>'+
        '<button id="pay-cash" class="btn btn-outline btn-between"><span><i class="fa-solid fa-wallet"></i> Pay with Cash</span><span id="pay-cash-amt">&#8377;'+planTotal()+'</span></button>'+
      '</div>';

    function refresh(){
      document.getElementById("bottle-qty").textContent = extraBottles;
      document.getElementById("bottle-minus").disabled = extraBottles === 0;
      document.getElementById("bottle-plus").disabled = extraBottles === MAX_EXTRA_BOTTLES;
      document.getElementById("extra-row").style.display = extraBottles > 0 ? "" : "none";
      document.getElementById("extra-row-value").innerHTML = extraBottles+" &times; &#8377;"+BOTTLE_PRICE;
      document.getElementById("total-amount").innerHTML = "&#8377;"+planTotal();
      document.getElementById("pay-online-amt").innerHTML = "&#8377;"+planTotal();
      document.getElementById("pay-cash-amt").innerHTML = "&#8377;"+planTotal();
    }
    wireBottleStepper(refresh);

    document.getElementById("pay-online").onclick = function(){ confirmPayment("Online"); };
    document.getElementById("pay-cash").onclick = function(){ confirmPayment("Cash"); };
  }

  function confirmPayment(method){
    var w = currentWorker();
    var onlineBtn = document.getElementById("pay-online");
    var cashBtn = document.getElementById("pay-cash");
    onlineBtn.disabled = true; cashBtn.disabled = true;
    var amtEl = document.getElementById(method==="Online" ? "pay-online-amt" : "pay-cash-amt");
    amtEl.innerHTML = '<span class="spinner"></span>'+(method==="Online" ? "Processing" : "Recording");

    setTimeout(function(){
      var total = planTotal();
      var bottlesBought = extraBottles;

      w.status = "Active";
      w.package = { total:total, method:method, extraBottles:bottlesBought };
      w.products = [{ name: "Package", qty: 1, status:"Processing", icon: "fa-box" }];
      if(bottlesBought > 0){
        w.products.push({ name: INCLUDED_PRODUCT.name, qty: bottlesBought, status:"Processing", icon: INCLUDED_PRODUCT.icon });
      }

      extraBottles = 0;
      sessionId = w.id;
      screen = "app";
      currentTab = "account";
      showToast(method==="Online" ? "Payment successful. Package activated." : "Cash payment recorded. Package activated.");
      confettiBurst();
      renderScreen();
    }, 900);
  }

  var reorderQty = 0;

  function renderProductsTab(w){
    var el = document.getElementById("tab-content");
    if(w.status !== "Active"){
      el.innerHTML =
        '<div class="empty-box">'+
          '<i class="fa-solid fa-box"></i>'+
          '<p class="t1">No products yet</p>'+
          '<p class="t2">Complete your &#8377;299 package payment to receive your first products.</p>'+
        '</div>';
      return;
    }
    reorderQty = 0;
    var listHtml = w.products.length
      ? w.products.map(function(p,idx){
          return '<div class="product-item" style="animation:cardEnter .4s ease both;animation-delay:'+(idx*0.06)+'s;">'+
            '<div class="product-icon"><i class="fa-solid '+(p.icon||"fa-box")+'"></i></div>'+
            '<div style="flex:1;min-width:0;"><p class="product-name">'+esc(p.name)+'</p><p class="product-qty">Quantity: '+p.qty+'</p></div>'+
            '<span class="product-status">'+esc(p.status)+'</span>'+
          '</div>';
        }).join("")
      : '';
    el.innerHTML = listHtml + reorderCardHtml();
    wireReorderCard(w);
  }

  function reorderCardHtml(){
    return ''+
      '<p class="section-kicker">Order more bottles</p>'+
      '<div class="plan-card">'+
        serumBottleSvg()+
        '<p class="plan-product-name">'+esc(INCLUDED_PRODUCT.name)+'</p>'+
        '<p class="plan-product-desc">&#8377;'+BOTTLE_PRICE+' per bottle</p>'+
      '</div>'+
      '<div class="bottle-qty-card">'+
        '<div><div class="bq-label">Bottles to order</div><div class="bq-sub">&#8377;'+BOTTLE_PRICE+' each</div></div>'+
        '<div class="stepper">'+
          '<button type="button" id="reorder-minus" disabled><i class="fa-solid fa-minus"></i></button>'+
          '<span id="reorder-qty">0</span>'+
          '<button type="button" id="reorder-plus"><i class="fa-solid fa-plus"></i></button>'+
        '</div>'+
      '</div>'+
      '<div class="total-row"><span class="t-label">Order Total</span><span class="t-value" id="reorder-total">&#8377;0</span></div>'+
      '<button id="reorder-btn" class="btn btn-primary btn-between" style="margin-top:14px;" disabled><span><i class="fa-solid fa-cart-plus"></i> Order Now</span><span id="reorder-btn-amt">&#8377;0</span></button>';
  }

  function wireReorderCard(w){
    function refresh(){
      var total = reorderQty * BOTTLE_PRICE;
      document.getElementById("reorder-qty").textContent = reorderQty;
      document.getElementById("reorder-minus").disabled = reorderQty === 0;
      document.getElementById("reorder-plus").disabled = reorderQty === MAX_EXTRA_BOTTLES;
      document.getElementById("reorder-total").innerHTML = "&#8377;"+total;
      document.getElementById("reorder-btn-amt").innerHTML = "&#8377;"+total;
      document.getElementById("reorder-btn").disabled = reorderQty === 0;
    }
    document.getElementById("reorder-minus").onclick = function(){ reorderQty = Math.max(0, reorderQty - 1); refresh(); };
    document.getElementById("reorder-plus").onclick = function(){ reorderQty = Math.min(MAX_EXTRA_BOTTLES, reorderQty + 1); refresh(); };
    document.getElementById("reorder-btn").onclick = function(){ placeReorder(w); };
    refresh();
  }

  function placeReorder(w){
    if(reorderQty === 0) return;
    var qty = reorderQty;
    var btn = document.getElementById("reorder-btn");
    var amtEl = document.getElementById("reorder-btn-amt");
    document.getElementById("reorder-minus").disabled = true;
    document.getElementById("reorder-plus").disabled = true;
    btn.disabled = true;
    amtEl.innerHTML = '<span class="spinner"></span>Placing order';

    setTimeout(function(){
      w.products.push({ name: INCLUDED_PRODUCT.name, qty: qty, status:"Processing", icon: INCLUDED_PRODUCT.icon });
      reorderQty = 0;
      showToast("Order placed for "+qty+" bottle"+(qty>1?"s":"")+".");
      confettiBurst();
      renderProductsTab(w);
    }, 800);
  }

  /* ---------- ROUTER ---------- */
  function renderScreen(){
    if(screen === "welcome") renderWelcome();
    else if(screen === "register") renderRegister();
    else if(screen === "payment") renderPaymentScreen();
    else if(screen === "login") renderLogin();
    else if(screen === "app") renderDashboard();
  }

  document.getElementById("logout-btn").onclick = function(){
    sessionId = null; screen = "welcome"; currentTab = "account";
    renderScreen();
  };

  renderScreen();
})();
</script>
</body>
</html>
